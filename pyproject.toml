[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cell-track"
version = "0.1.0"
description = "Reproducible preprocessing, segmentation, and tracking for darkfield cell time-lapse movies"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Xicheng Yang" },
]

[tool.setuptools.packages.find]
where = ["src"]
